name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          echo "Running static analysis..."
          test -s index.html
          echo "index.html exists and is not empty"

      - name: Check CSS file
        run: |
          test -s style.css
          echo "style.css exists and is not empty"

      - name: Static Analysis Complete
        run: echo "Static analysis completed successfully"
