<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Automation Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>DevOps Automation Lab</h1>

        <p>
            This website demonstrates Continuous Integration,
            CD, ChatOps notifications,
            and cloud-based hosting using GitHub Actions and Netlify.
        </p>

        <button onclick="showMessage()">Run Deployment</button>

        <p id="msg"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("msg").innerHTML =
                "Build and Deployment Successful!";
        }
    </script>
</body>
</html>
